<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seamless Pattern Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0ee;--surface:#fdf8f6;--sage:#7d9b7a;--sage-light:#c8dbc6;--sage-pale:#eaf2e9;--pink:#e8a8b0;--pink-light:#f7dde0;--pink-pale:#fdf0f1;--ink:#3b3634;--muted:#9a9390;--border:#e2d9d6;--white:#fffcfb;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
body::before{content:'';position:fixed;top:-120px;right:-120px;width:420px;height:420px;background:radial-gradient(circle,#f2c8cd44 0%,transparent 70%);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;bottom:-80px;left:-80px;width:340px;height:340px;background:radial-gradient(circle,#c8dbc644 0%,transparent 70%);pointer-events:none;z-index:0;}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px 80px;position:relative;z-index:1;}
header{padding:44px 0 28px;}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:14px 0 0 var(--sage-light);}
.eyebrow{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--sage);font-weight:500;margin-left:26px;}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,4vw,40px);line-height:1.1;font-weight:300;margin-bottom:8px;}
h1 em{font-style:italic;color:var(--sage);}
header p{font-size:13px;color:var(--muted);}
.divider{height:1px;background:linear-gradient(90deg,var(--pink-light),var(--sage-light),transparent);margin:20px 0 24px;}
.tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:6px;}
.tab-btn{flex:1;padding:10px;border-radius:12px;border:none;background:none;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all 0.15s;}
.tab-btn.active{background:var(--sage);color:white;}
.tab-btn:hover:not(.active){background:var(--sage-pale);color:var(--ink);}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* Layout: left panel + right (preview + controls) */
.main-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start;}
.right-layout{display:grid;grid-template-rows:auto auto;gap:12px;}
.preview-controls{display:grid;grid-template-columns:1fr 200px;gap:12px;align-items:start;}

.panel{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;}
.panel-title{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;}

/* Upload */
.upload-zone{border:1.5px dashed var(--pink);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;background:var(--pink-pale);transition:all 0.2s;position:relative;margin-bottom:8px;}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--sage);background:var(--sage-pale);}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-zone p{font-size:11px;color:var(--muted);margin-top:3px;}
.clipart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px;max-height:160px;overflow-y:auto;}
.clipart-thumb{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--border);background:repeating-conic-gradient(#e8e0dc 0% 25%,#f5f0ee 0% 50%) 0 0/6px 6px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.clipart-thumb img{width:90%;height:90%;object-fit:contain;}
.clipart-thumb .remove{position:absolute;top:1px;right:1px;width:14px;height:14px;background:var(--pink);border-radius:50%;border:none;cursor:pointer;font-size:9px;color:white;display:none;align-items:center;justify-content:center;}
.clipart-thumb:hover .remove{display:flex;}

/* Controls */
.control-group{margin-bottom:10px;}
.control-label{font-size:10px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;}
.control-label span{color:var(--ink);font-weight:500;}
input[type=range]{width:100%;accent-color:var(--sage);cursor:pointer;}
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:10px;}
.preset-btn{padding:6px 2px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:9px;color:var(--muted);text-align:center;transition:all 0.15s;font-family:'Jost',sans-serif;}
.preset-btn:hover{border-color:var(--sage);color:var(--sage);}
.preset-btn.active{background:var(--sage-pale);border-color:var(--sage);color:var(--ink);font-weight:500;}
.preset-icon{font-size:13px;display:block;margin-bottom:1px;}

/* Canvas */
.canvas-wrap{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;}
.canvas-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.canvas-title{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:500;}
.canvas-container{border-radius:10px;overflow:hidden;border:1px solid var(--border);background:repeating-conic-gradient(#e8e0dc 0% 25%,#f5f0ee 0% 50%) 0 0/10px 10px;display:flex;align-items:center;justify-content:center;min-height:360px;}
canvas{display:block;max-width:100%;}
.tiles-row{display:flex;gap:5px;}
.tile-btn{flex:1;padding:6px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-family:'Jost',sans-serif;font-size:10px;color:var(--muted);cursor:pointer;transition:all 0.15s;text-align:center;}
.tile-btn.active{background:var(--pink-pale);border-color:var(--pink);color:var(--ink);}

/* Right controls panel */
.right-ctrl{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;}
.color-btn{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform 0.1s;}
.color-btn:hover{transform:scale(1.1);}
.color-btn.active{border-color:var(--ink);}
.color-custom-sm{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);cursor:pointer;overflow:hidden;padding:0;background:none;}
.color-custom-sm input[type=color]{width:26px;height:26px;border:none;margin:-3px;cursor:pointer;}
.color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px;}
.dl-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--sage),#6a8a67);color:white;border:none;border-radius:11px;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:opacity 0.15s;}
.dl-btn:hover{opacity:0.9;}
.dl-btn:disabled{opacity:0.4;cursor:not-allowed;}
.size-select{width:100%;font-family:'Jost',sans-serif;font-size:11px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;}
.color-pair{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.color-pair label{font-size:10px;color:var(--muted);width:44px;flex-shrink:0;}
.color-pair input[type=color]{flex:1;height:26px;border-radius:6px;border:1px solid var(--border);cursor:pointer;padding:2px;}
.geo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.geo-btn{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;overflow:hidden;transition:all 0.15s;display:flex;align-items:center;justify-content:center;}
.geo-btn:hover{border-color:var(--sage);}
.geo-btn.active{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage-light);}
.geo-btn canvas{width:100%;height:100%;display:block;}
.geo-label{font-size:8px;color:var(--muted);text-align:center;margin-top:2px;}
.switch-row{display:flex;gap:5px;margin-bottom:8px;}
.switch-btn{flex:1;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-family:'Jost',sans-serif;font-size:10px;color:var(--muted);cursor:pointer;transition:all 0.15s;text-align:center;}
.switch-btn.active{background:var(--sage-pale);border-color:var(--sage);color:var(--ink);font-weight:500;}
select.pat-select{width:100%;font-family:'Jost',sans-serif;font-size:11px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;margin-bottom:6px;}

@media(max-width:768px){.main-layout{grid-template-columns:1fr;}.preview-controls{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-row"><div class="logo-dot"></div><span class="eyebrow">Clipart Tools</span></div>
    <h1>Seamless <em>Pattern</em> Maker</h1>
    <p>クリップアートと幾何学パターンを組み合わせてシームレスパターンを作成できます。</p>
  </header>
  <div class="divider"></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('clipart',this)">🌸 クリップアートパターン</button>
    <button class="tab-btn" onclick="switchTab('geo',this)">◈ ストライプ・幾何学パターン</button>
  </div>

  <!-- TAB 1: Clipart -->
  <div class="tab-content active" id="tab-clipart">
    <div class="main-layout">
      <!-- Left: upload + layout -->
      <div>
        <div class="panel">
          <div class="panel-title">クリップアート</div>
          <div class="upload-zone" id="uploadZone">
            <input type="file" id="fileInput" accept="image/png,image/svg+xml,image/jpeg,image/webp" multiple>
            <div style="font-size:18px;">🌸</div>
            <p>PNG・SVGをドロップ<br>または クリックして選択</p>
          </div>
          <div class="clipart-grid" id="clipartGrid"></div>
        </div>
        <div class="panel">
          <div class="panel-title">レイアウト</div>
          <div class="preset-grid">
            <button class="preset-btn active" data-preset="grid" onclick="setPreset('grid',this)"><span class="preset-icon">⊞</span>グリッド</button>
            <button class="preset-btn" data-preset="brick" onclick="setPreset('brick',this)"><span class="preset-icon">▦</span>レンガ</button>
            <button class="preset-btn" data-preset="diagonal" onclick="setPreset('diagonal',this)"><span class="preset-icon">◈</span>斜め</button>
            <button class="preset-btn" data-preset="scatter" onclick="setPreset('scatter',this)"><span class="preset-icon">✦</span>散らし</button>
            <button class="preset-btn" data-preset="dense" onclick="setPreset('dense',this)"><span class="preset-icon">⊡</span>密集</button>
            <button class="preset-btn" data-preset="sparse" onclick="setPreset('sparse',this)"><span class="preset-icon">○</span>ゆとり</button>
          </div>
          <div class="control-group"><div class="control-label">サイズ <span id="sizeVal">300px</span></div><input type="range" id="itemSize" min="40" max="1500" value="300" oninput="updateVal('sizeVal',this.value+'px');drawPattern()"></div>
          <div class="control-group"><div class="control-label">間隔 <span id="gapVal">20px</span></div><input type="range" id="itemGap" min="0" max="400" value="20" oninput="updateVal('gapVal',this.value+'px');drawPattern()"></div>
          <div class="control-group"><div class="control-label">回転 <span id="rotVal">0°</span></div><input type="range" id="itemRot" min="-45" max="45" value="0" oninput="updateVal('rotVal',this.value+'°');drawPattern()"></div>
          <div class="control-group"><div class="control-label">ランダム回転 <span id="randVal">0°</span></div><input type="range" id="itemRand" min="0" max="45" value="0" oninput="updateVal('randVal',this.value+'°');drawPattern()"></div>
        </div>
      </div>

      <!-- Right: preview + controls -->
      <div class="right-layout">
        <div class="preview-controls">
          <!-- Preview -->
          <div class="canvas-wrap">
            <div class="canvas-header">
              <div class="canvas-title">プレビュー</div>
              <div class="tiles-row">
                <button class="tile-btn active" onclick="setTileView(1,this)">1×1</button>
                <button class="tile-btn" onclick="setTileView(2,this)">2×2</button>
                <button class="tile-btn" onclick="setTileView(3,this)">3×3</button>
              </div>
            </div>
            <div class="canvas-container" id="canvasContainer">
              <div id="emptyState" style="text-align:center;padding:40px 20px;color:var(--muted);">
                <div style="font-size:32px;margin-bottom:8px;">🌸</div>
                <p style="font-size:12px;">クリップアートをアップロードしてください</p>
              </div>
              <canvas id="patternCanvas" style="display:none;"></canvas>
            </div>
          </div>

          <!-- Right controls -->
          <div class="right-ctrl">
            <div>
              <div class="panel-title">背景タイプ</div>
              <div class="switch-row">
                <button class="switch-btn active" id="bgTypeColor" onclick="setBgType('color',this)">単色</button>
                <button class="switch-btn" id="bgTypePattern" onclick="setBgType('pattern',this)">パターン</button>
              </div>
              <div id="bgColorSection">
                <input type="color" id="bgColorPicker" value="#fffcfb" oninput="setBg(this.value,null)" style="width:100%;height:36px;border-radius:8px;border:1px solid var(--border);cursor:pointer;padding:2px;margin-bottom:6px;">
                <div class="color-grid" id="bgColorRow">
                  <button class="color-btn active" style="background:#fffcfb;" onclick="setBg('#fffcfb',this);document.getElementById('bgColorPicker').value='#fffcfb'"></button>
                  <button class="color-btn" style="background:#f5f0ee;" onclick="setBg('#f5f0ee',this);document.getElementById('bgColorPicker').value='#f5f0ee'"></button>
                  <button class="color-btn" style="background:#fdf0f1;" onclick="setBg('#fdf0f1',this);document.getElementById('bgColorPicker').value='#fdf0f1'"></button>
                  <button class="color-btn" style="background:#eaf2e9;" onclick="setBg('#eaf2e9',this);document.getElementById('bgColorPicker').value='#eaf2e9'"></button>
                  <button class="color-btn" style="background:#c8dbc6;" onclick="setBg('#c8dbc6',this);document.getElementById('bgColorPicker').value='#c8dbc6'"></button>
                  <button class="color-btn" style="background:#e8a8b0;" onclick="setBg('#e8a8b0',this);document.getElementById('bgColorPicker').value='#e8a8b0'"></button>
                  <button class="color-btn" style="background:#7d9b7a;" onclick="setBg('#7d9b7a',this);document.getElementById('bgColorPicker').value='#7d9b7a'"></button>
                  <button class="color-btn" style="background:#264653;" onclick="setBg('#264653',this);document.getElementById('bgColorPicker').value='#264653'"></button>
                  <button class="color-btn" style="background:#3b3634;" onclick="setBg('#3b3634',this);document.getElementById('bgColorPicker').value='#3b3634'"></button>
                  <button class="color-btn" style="background:#ffffff;border:1px solid #ddd;" onclick="setBg('#ffffff',this);document.getElementById('bgColorPicker').value='#ffffff'"></button>
                  <button class="color-btn" style="background:transparent;border:1.5px dashed #ccc;font-size:7px;color:var(--muted);" onclick="setBg('transparent',this)" title="透過">透過</button>
                  <button class="color-custom-sm"><input type="color" value="#ffffff" oninput="setBg(this.value,null);document.getElementById('bgColorPicker').value=this.value"></button>
                </div>
              </div>
              <div id="bgPatternSection" style="display:none;">
                <select class="pat-select" id="bgPatternType" onchange="drawPattern()">
                  <option value="stripe-v">縦ストライプ</option>
                  <option value="stripe-h">横ストライプ</option>
                  <option value="stripe-d">斜めストライプ</option>
                  <option value="check">チェック</option>
                  <option value="gingham">ギンガム</option>
                  <option value="argyle">アーガイル</option>
                  <option value="dot">ドット</option>
                  <option value="polka">ポルカドット</option>
                  <option value="herringbone">ヘリンボーン</option>
                  <option value="tartan">タータン</option>
                </select>
                <div class="color-pair"><label>カラー1</label><input type="color" id="bgCol1" value="#f7dde0" oninput="drawPattern()"></div>
                <div class="color-pair"><label>カラー2</label><input type="color" id="bgCol2" value="#fffcfb" oninput="drawPattern()"></div>
                <div class="color-pair"><label>カラー3</label><input type="color" id="bgCol3" value="#c8dbc6" oninput="drawPattern()"></div>
                <div class="control-group"><div class="control-label">パターンサイズ <span id="bgPatSizeVal">40px</span></div><input type="range" id="bgPatSize" min="10" max="300" value="40" oninput="updateVal('bgPatSizeVal',this.value+'px');drawPattern()"></div>
                <div class="control-group"><div class="control-label">線の太さ <span id="bgPatWeightVal">4px</span></div><input type="range" id="bgPatWeight" min="1" max="60" value="4" oninput="updateVal('bgPatWeightVal',this.value+'px');drawPattern()"></div>
              </div>
            </div>
            <div>
              <div class="panel-title">書き出し</div>
              <select class="size-select" id="exportSize" style="margin-bottom:8px;">
                <option value="1000">1000 × 1000 px</option>
                <option value="2000" selected>2000 × 2000 px</option>
                <option value="3000">3000 × 3000 px</option>
                <option value="4000">4000 × 4000 px</option>
              </select>
              <button class="dl-btn" id="dlBtn" onclick="downloadPattern()" disabled>ダウンロード 🌿</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 2: Geo -->
  <div class="tab-content" id="tab-geo">
    <div class="main-layout">
      <!-- Left: pattern selector + colors -->
      <div>
        <div class="panel">
          <div class="panel-title">パターンを選ぶ</div>
          <div class="geo-grid" id="geoGrid"></div>
        </div>
        <div class="panel">
          <div class="panel-title">カラー</div>
          <div class="color-pair"><label>カラー1</label><input type="color" id="geoColor1" value="#e8a8b0" oninput="drawGeo()"></div>
          <div class="color-pair"><label>カラー2</label><input type="color" id="geoColor2" value="#fdf8f6" oninput="drawGeo()"></div>
          <div class="color-pair"><label>カラー3</label><input type="color" id="geoColor3" value="#7d9b7a" oninput="drawGeo()"></div>
        </div>
      </div>
      <!-- Right: preview + controls -->
      <div class="right-layout">
        <div class="preview-controls">
          <div class="canvas-wrap">
            <div class="canvas-header">
              <div class="canvas-title">プレビュー</div>
              <div class="tiles-row">
                <button class="tile-btn active" onclick="setGeoTile(1,this)">1×1</button>
                <button class="tile-btn" onclick="setGeoTile(2,this)">2×2</button>
                <button class="tile-btn" onclick="setGeoTile(3,this)">3×3</button>
              </div>
            </div>
            <div class="canvas-container" id="geoContainer">
              <canvas id="geoCanvas"></canvas>
            </div>
          </div>
          <!-- Right controls -->
          <div class="right-ctrl">
            <div>
              <div class="panel-title">サイズ・太さ</div>
              <div class="control-group"><div class="control-label">パターンサイズ <span id="geoSizeVal">60px</span></div><input type="range" id="geoSize" min="10" max="300" value="60" oninput="updateVal('geoSizeVal',this.value+'px');drawGeo()"></div>
              <div class="control-group"><div class="control-label">線の太さ <span id="geoWeightVal">8px</span></div><input type="range" id="geoWeight" min="1" max="80" value="8" oninput="updateVal('geoWeightVal',this.value+'px');drawGeo()"></div>
              <div class="control-group"><div class="control-label">角度 <span id="geoAngleVal">45°</span></div><input type="range" id="geoAngle" min="0" max="90" value="45" oninput="updateVal('geoAngleVal',this.value+'°');drawGeo()"></div>
            </div>
            <div>
              <div class="panel-title">書き出し</div>
              <select class="size-select" id="geoExportSize" style="margin-bottom:8px;">
                <option value="1000">1000 × 1000 px</option>
                <option value="2000" selected>2000 × 2000 px</option>
                <option value="3000">3000 × 3000 px</option>
                <option value="4000">4000 × 4000 px</option>
              </select>
              <button class="dl-btn" onclick="downloadGeo()">ダウンロード 🌿</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function switchTab(id,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
  if(id==='geo')setTimeout(drawGeo,50);
}
function updateVal(id,val){document.getElementById(id).textContent=val;}

// ===== シームレスパターン描画（完全版）=====
// キャンバスのクリッピング領域に対してシームレスになるよう描画
// patternを使ったCanvasの繰り返しパターンを活用

function makeGeoPattern(ctx, pattern, s, lw, col1, col2, col3, angle) {
  // 最小繰り返し単位のオフスクリーンcanvasを作成
  const a = angle * Math.PI / 180;
  let tw, th;

  // パターンごとの繰り返し単位サイズ
  switch(pattern) {
    case 'stripe-v': tw=s; th=s; break;
    case 'stripe-h': tw=s; th=s; break;
    case 'stripe-d': tw=s; th=s; break;
    case 'stripe-multi': tw=s*4; th=s; break;
    case 'check': tw=s*2; th=s*2; break;
    case 'gingham': tw=s*2; th=s*2; break;
    case 'argyle': tw=s*2; th=s*2; break;
    case 'diamond': tw=s*2; th=s*2; break;
    case 'dot': tw=s; th=s; break;
    case 'polka': tw=s*2; th=s*2; break;
    case 'herringbone': tw=s; th=s; break;
    case 'zigzag': tw=s*2; th=s; break;
    case 'tartan': tw=s*2; th=s*2; break;
    default: tw=s; th=s;
  }

  const oc = document.createElement('canvas');
  oc.width = tw; oc.height = th;
  const oc2 = oc.getContext('2d');
  oc2.fillStyle = col2;
  oc2.fillRect(0,0,tw,th);

  switch(pattern) {
    case 'stripe-v':
      oc2.fillStyle=col1; oc2.fillRect(0,0,lw,th);
      break;
    case 'stripe-h':
      oc2.fillStyle=col1; oc2.fillRect(0,0,tw,lw);
      break;
    case 'stripe-d':{
      // 斜めストライプ：45度固定でシームレスな正方形タイル
      // タイルサイズをsにして対角線で分割
      oc2.fillStyle=col1;
      // 上三角
      oc2.beginPath();oc2.moveTo(0,0);oc2.lineTo(lw,0);oc2.lineTo(tw,th-lw);oc2.lineTo(tw,th);oc2.lineTo(tw-lw,th);oc2.lineTo(0,lw);oc2.closePath();oc2.fill();
      // 右上と左下の端（シームレス用）
      oc2.beginPath();oc2.moveTo(tw-lw,0);oc2.lineTo(tw,0);oc2.lineTo(tw,lw);oc2.closePath();oc2.fill();
      oc2.beginPath();oc2.moveTo(0,th-lw);oc2.lineTo(lw,th);oc2.lineTo(0,th);oc2.closePath();oc2.fill();
      break;
    }
    case 'stripe-multi':{
      const colors=[col1,col2,col3,col2];
      let x=0;
      colors.forEach(c=>{oc2.fillStyle=c;oc2.fillRect(x,0,lw,th);x+=lw;});
      break;
    }
    case 'check':
      oc2.fillStyle=col1; oc2.fillRect(0,0,s,s);
      oc2.fillStyle=col1; oc2.fillRect(s,s,s,s);
      break;
    case 'gingham':{
      oc2.fillStyle=col1; oc2.fillRect(0,0,s,s);
      oc2.fillStyle=col1; oc2.fillRect(s,s,s,s);
      oc2.globalAlpha=0.4;
      oc2.fillStyle=col1; oc2.fillRect(s,0,s,th);
      oc2.fillStyle=col1; oc2.fillRect(0,s,tw,s);
      oc2.globalAlpha=1; break;
    }
    case 'argyle':{
      // アーガイル：繰り返し単位はダイヤ2個分（tw=s*2, th=s*2）
      // 中央ダイヤ（col1）
      oc2.fillStyle=col1;
      oc2.beginPath();oc2.moveTo(s,0);oc2.lineTo(tw,s);oc2.lineTo(s,th);oc2.lineTo(0,s);oc2.closePath();oc2.fill();
      // 四隅のダイヤ（col3）- シームレスのため分割して4隅に
      oc2.fillStyle=col3;
      // 上左（1/4ダイヤ）
      oc2.beginPath();oc2.moveTo(0,0);oc2.lineTo(s,0);oc2.lineTo(0,s);oc2.closePath();oc2.fill();
      // 上右（1/4ダイヤ）
      oc2.beginPath();oc2.moveTo(tw,0);oc2.lineTo(s,0);oc2.lineTo(tw,s);oc2.closePath();oc2.fill();
      // 下左（1/4ダイヤ）
      oc2.beginPath();oc2.moveTo(0,th);oc2.lineTo(s,th);oc2.lineTo(0,s);oc2.closePath();oc2.fill();
      // 下右（1/4ダイヤ）
      oc2.beginPath();oc2.moveTo(tw,th);oc2.lineTo(s,th);oc2.lineTo(tw,s);oc2.closePath();oc2.fill();
      // 枠線
      const slw=Math.max(1,lw/3);
      oc2.strokeStyle=col2;oc2.lineWidth=slw;
      oc2.beginPath();oc2.moveTo(s,0);oc2.lineTo(tw,s);oc2.lineTo(s,th);oc2.lineTo(0,s);oc2.closePath();oc2.stroke();
      // 対角クロス線（アーガイルの特徴）
      oc2.strokeStyle=col2;oc2.lineWidth=slw;
      oc2.beginPath();oc2.moveTo(0,0);oc2.lineTo(tw,th);oc2.stroke();
      oc2.beginPath();oc2.moveTo(tw,0);oc2.lineTo(0,th);oc2.stroke();
      break;
    }
    case 'diamond':{
      oc2.strokeStyle=col1; oc2.lineWidth=lw;
      oc2.beginPath(); oc2.moveTo(tw/2,0); oc2.lineTo(tw,th/2); oc2.lineTo(tw/2,th); oc2.lineTo(0,th/2); oc2.closePath(); oc2.stroke();
      break;
    }
    case 'dot':{
      oc2.beginPath(); oc2.arc(tw/2,th/2,lw*1.5,0,Math.PI*2); oc2.fillStyle=col1; oc2.fill(); break;
    }
    case 'polka':{
      const r=s*0.35;
      oc2.beginPath(); oc2.arc(s/2,s/2,r,0,Math.PI*2); oc2.fillStyle=col1; oc2.fill();
      oc2.beginPath(); oc2.arc(s+s/2,s+s/2,r,0,Math.PI*2); oc2.fillStyle=col1; oc2.fill();
      // 端の半円（シームレスのため）
      oc2.beginPath(); oc2.arc(0,0,r,0,Math.PI*2); oc2.fill();
      oc2.beginPath(); oc2.arc(tw,0,r,0,Math.PI*2); oc2.fill();
      oc2.beginPath(); oc2.arc(0,th,r,0,Math.PI*2); oc2.fill();
      oc2.beginPath(); oc2.arc(tw,th,r,0,Math.PI*2); oc2.fill();
      break;
    }
    case 'herringbone':{
      oc2.strokeStyle=col1; oc2.lineWidth=lw;
      oc2.beginPath(); oc2.moveTo(0,th); oc2.lineTo(tw/2,0); oc2.stroke();
      oc2.beginPath(); oc2.moveTo(tw/2,th); oc2.lineTo(tw,0); oc2.stroke();
      break;
    }
    case 'zigzag':{
      oc2.strokeStyle=col1; oc2.lineWidth=lw;
      oc2.beginPath(); oc2.moveTo(0,th/2); oc2.lineTo(s/2,0); oc2.lineTo(s,th/2); oc2.lineTo(s+s/2,0); oc2.lineTo(s*2,th/2); oc2.stroke();
      break;
    }
    case 'tartan':{
      oc2.globalAlpha=0.85;
      oc2.fillStyle=col1; oc2.fillRect(0,0,lw*2,th); oc2.fillRect(s,0,lw*2,th);
      oc2.fillStyle=col3; oc2.fillRect(s/2,0,lw,th); oc2.fillRect(s+s/2,0,lw,th);
      oc2.fillStyle=col1; oc2.fillRect(0,0,tw,lw*2); oc2.fillRect(0,s,tw,lw*2);
      oc2.fillStyle=col3; oc2.fillRect(0,s/2,tw,lw); oc2.fillRect(0,s+s/2,tw,lw);
      oc2.globalAlpha=1; break;
    }
  }

  return ctx.createPattern(oc, 'repeat');
}

// ===== CLIPART TAB =====
let cliparts=[], bgColor='#fffcfb', bgType='color', currentPreset='grid', tileView=1;
const patternCanvas=document.getElementById('patternCanvas');
const pCtx=patternCanvas.getContext('2d');
const SEED=42;
function seededRandom(seed){let s=seed;return function(){s=(s*16807+0)%2147483647;return(s-1)/2147483646;};}

document.getElementById('fileInput').addEventListener('change',e=>{loadFiles(Array.from(e.target.files));e.target.value='';});
const uz=document.getElementById('uploadZone');
uz.addEventListener('dragover',e=>{e.preventDefault();uz.classList.add('drag-over');});
uz.addEventListener('dragleave',()=>uz.classList.remove('drag-over'));
uz.addEventListener('drop',e=>{e.preventDefault();uz.classList.remove('drag-over');loadFiles(Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/')));});

function loadFiles(files){files.forEach(f=>{const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{cliparts.push({img,url});renderThumbs();drawPattern();};img.src=url;});}

function renderThumbs(){
  const grid=document.getElementById('clipartGrid');grid.innerHTML='';
  cliparts.forEach((c,i)=>{
    const div=document.createElement('div');div.className='clipart-thumb';
    const img=document.createElement('img');img.src=c.url;
    const rm=document.createElement('button');rm.className='remove';rm.innerHTML='×';
    rm.onclick=e=>{e.stopPropagation();cliparts.splice(i,1);renderThumbs();drawPattern();};
    div.appendChild(img);div.appendChild(rm);grid.appendChild(div);
  });
  document.getElementById('emptyState').style.display=cliparts.length?'none':'block';
  patternCanvas.style.display=cliparts.length?'block':'none';
  document.getElementById('dlBtn').disabled=!cliparts.length;
}

function setPreset(preset,btn){
  currentPreset=preset;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  const p={grid:{size:300,gap:20,rot:0,rand:0},brick:{size:280,gap:16,rot:0,rand:0},diagonal:{size:260,gap:24,rot:15,rand:0},scatter:{size:240,gap:10,rot:0,rand:35},dense:{size:200,gap:4,rot:0,rand:10},sparse:{size:360,gap:80,rot:0,rand:20}}[preset];
  document.getElementById('itemSize').value=p.size;document.getElementById('itemGap').value=p.gap;
  document.getElementById('itemRot').value=p.rot;document.getElementById('itemRand').value=p.rand;
  updateVal('sizeVal',p.size+'px');updateVal('gapVal',p.gap+'px');updateVal('rotVal',p.rot+'°');updateVal('randVal',p.rand+'°');
  drawPattern();
}

function setBgType(type,btn){
  bgType=type;
  document.getElementById('bgTypeColor').classList.toggle('active',type==='color');
  document.getElementById('bgTypePattern').classList.toggle('active',type==='pattern');
  document.getElementById('bgColorSection').style.display=type==='color'?'block':'none';
  document.getElementById('bgPatternSection').style.display=type==='pattern'?'block':'none';
  drawPattern();
}

function setBg(color,btn){
  bgColor=color;
  document.querySelectorAll('#bgColorRow .color-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  drawPattern();
}

function setTileView(n,btn){
  tileView=n;
  document.querySelectorAll('#tab-clipart .tile-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTilePreview();
}

function buildTile(size, gap, rot, rand) {
  const step=size+gap;
  const n=Math.min(cliparts.length,4);
  const tileCols=n<=1?1:2, tileRows=n<=2?1:2;
  const tileW=step*tileCols, tileH=step*tileRows;

  const tile=document.createElement('canvas');
  tile.width=tileW; tile.height=tileH;
  const tc=tile.getContext('2d');

  // 背景：CanvasのcreatePatternで完全シームレス
  if(bgType==='pattern'){
    const bgPat=document.getElementById('bgPatternType').value;
    const bgC1=document.getElementById('bgCol1').value;
    const bgC2=document.getElementById('bgCol2').value;
    const bgC3=document.getElementById('bgCol3').value;
    const bgS=parseInt(document.getElementById('bgPatSize').value);
    const bgW=parseInt(document.getElementById('bgPatWeight').value);
    const pat=makeGeoPattern(tc,bgPat,bgS,bgW,bgC1,bgC2,bgC3,45);
    if(pat){tc.fillStyle=pat;tc.fillRect(0,0,tileW,tileH);}
  }else if(bgColor!=='transparent'){
    tc.fillStyle=bgColor;tc.fillRect(0,0,tileW,tileH);
  }

  // クリップアートをラップアラウンドで配置
  const rng=seededRandom(SEED);
  const positions=[];
  let idx=0;
  for(let row=0;row<tileRows;row++){
    for(let col=0;col<tileCols;col++){
      if(idx>=n)break;
      let cx=col*step+step/2, cy=row*step+step/2;
      if(currentPreset==='brick'&&row%2!==0)cx+=step/2;
      if(currentPreset==='diagonal')cx+=row*(step/2);
      const r=rot+(rng()*2-1)*rand;
      positions.push({img:cliparts[idx].img,cx,cy,r});
      idx++;
    }
  }

  positions.forEach(({img,cx,cy,r})=>{
    for(let dy=-1;dy<=1;dy++){
      for(let dx=-1;dx<=1;dx++){
        const ox=cx+dx*tileW, oy=cy+dy*tileH;
        if(ox+size/2>=0&&ox-size/2<=tileW&&oy+size/2>=0&&oy-size/2<=tileH){
          tc.save();tc.translate(ox,oy);tc.rotate(r);
          tc.drawImage(img,-size/2,-size/2,size,size);
          tc.restore();
        }
      }
    }
  });

  return tile;
}

function drawPattern(){
  if(!cliparts.length)return;
  const size=parseInt(document.getElementById('itemSize').value);
  const gap=parseInt(document.getElementById('itemGap').value);
  const rot=parseInt(document.getElementById('itemRot').value)*Math.PI/180;
  const rand=parseInt(document.getElementById('itemRand').value)*Math.PI/180;
  window._cachedTile=buildTile(size,gap,rot,rand);
  renderTilePreview();
}

function renderTilePreview(){
  if(!cliparts.length||!window._cachedTile)return;
  const tile=window._cachedTile;
  const n=tileView;
  const previewSize=Math.min(480,document.getElementById('canvasContainer').clientWidth-40);
  patternCanvas.width=previewSize;patternCanvas.height=previewSize;
  const tw=tile.width,th=tile.height;
  const scale=previewSize/(Math.max(tw,th)*n);
  const sw=tw*scale,sh=th*scale;
  const cols=Math.ceil(previewSize/sw)+1,rows=Math.ceil(previewSize/sh)+1;
  pCtx.clearRect(0,0,previewSize,previewSize);
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++)
    pCtx.drawImage(tile,col*sw,row*sh,sw,sh);
}

function downloadPattern(){
  if(!cliparts.length)return;
  const exportSize=parseInt(document.getElementById('exportSize').value);
  const size=parseInt(document.getElementById('itemSize').value);
  const gap=parseInt(document.getElementById('itemGap').value);
  const rot=parseInt(document.getElementById('itemRot').value)*Math.PI/180;
  const rand=parseInt(document.getElementById('itemRand').value)*Math.PI/180;
  const tile=buildTile(size,gap,rot,rand);
  const expCanvas=document.createElement('canvas');
  expCanvas.width=exportSize;expCanvas.height=exportSize;
  const ec=expCanvas.getContext('2d');
  const tw=tile.width,th=tile.height;
  const cols=Math.ceil(exportSize/tw)+1,rows=Math.ceil(exportSize/th)+1;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++)
    ec.drawImage(tile,col*tw,row*th,tw,th);
  const a=document.createElement('a');a.href=expCanvas.toDataURL('image/png');
  a.download=`seamless-pattern-${exportSize}px.png`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

window.addEventListener('resize',()=>{if(cliparts.length)renderTilePreview();});

// ===== GEO TAB =====
const geoPatterns=[
  {id:'stripe-v',label:'縦ストライプ'},{id:'stripe-h',label:'横ストライプ'},{id:'stripe-d',label:'斜めストライプ'},
  {id:'stripe-multi',label:'マルチストライプ'},{id:'check',label:'チェック'},{id:'gingham',label:'ギンガム'},
  {id:'argyle',label:'アーガイル'},{id:'diamond',label:'ダイヤモンド'},{id:'dot',label:'ドット'},
  {id:'polka',label:'ポルカドット'},{id:'herringbone',label:'ヘリンボーン'},{id:'zigzag',label:'ジグザグ'},
  {id:'tartan',label:'タータン'},
];
let currentGeo='stripe-v',geoTileView=1;
const geoCanvas=document.getElementById('geoCanvas');
const geoCtx=geoCanvas.getContext('2d');

function initGeoGrid(){
  const grid=document.getElementById('geoGrid');
  geoPatterns.forEach(p=>{
    const wrap=document.createElement('div');
    const btn=document.createElement('button');
    btn.className='geo-btn'+(p.id===currentGeo?' active':'');
    const c=document.createElement('canvas');c.width=60;c.height=60;
    const pat=makeGeoPattern(c.getContext('2d'),p.id,20,4,'#e8a8b0','#fdf8f6','#7d9b7a',45);
    if(pat){const cc=c.getContext('2d');cc.fillStyle=pat;cc.fillRect(0,0,60,60);}
    btn.appendChild(c);
    btn.onclick=()=>{document.querySelectorAll('.geo-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentGeo=p.id;drawGeo();};
    const label=document.createElement('div');label.className='geo-label';label.textContent=p.label;
    wrap.appendChild(btn);wrap.appendChild(label);grid.appendChild(wrap);
  });
}

function buildGeoTile(){
  const size=parseInt(document.getElementById('geoSize').value);
  const weight=parseInt(document.getElementById('geoWeight').value);
  const angle=parseInt(document.getElementById('geoAngle').value);
  const col1=document.getElementById('geoColor1').value;
  const col2=document.getElementById('geoColor2').value;
  const col3=document.getElementById('geoColor3').value;
  const tileSize=size*2;
  const tile=document.createElement('canvas');tile.width=tileSize;tile.height=tileSize;
  const tc=tile.getContext('2d');
  const pat=makeGeoPattern(tc,currentGeo,size,weight,col1,col2,col3,angle);
  if(pat){tc.fillStyle=pat;tc.fillRect(0,0,tileSize,tileSize);}
  return tile;
}

function drawGeo(){
  const tile=buildGeoTile();
  window._cachedGeoTile=tile;
  const previewSize=Math.min(480,document.getElementById('geoContainer').clientWidth-40);
  geoCanvas.width=previewSize;geoCanvas.height=previewSize;
  const n=geoTileView,tw=tile.width,th=tile.height;
  const scale=previewSize/(Math.max(tw,th)*n);
  const sw=tw*scale,sh=th*scale;
  geoCtx.clearRect(0,0,previewSize,previewSize);
  const cols=Math.ceil(previewSize/sw)+1,rows=Math.ceil(previewSize/sh)+1;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++)
    geoCtx.drawImage(tile,col*sw,row*sh,sw,sh);
  // サムネ更新
  document.querySelectorAll('.geo-btn canvas').forEach((c,i)=>{
    const pat=makeGeoPattern(c.getContext('2d'),geoPatterns[i].id,20,4,
      document.getElementById('geoColor1').value,
      document.getElementById('geoColor2').value,
      document.getElementById('geoColor3').value,45);
    if(pat){const cc=c.getContext('2d');cc.clearRect(0,0,60,60);cc.fillStyle=pat;cc.fillRect(0,0,60,60);}
  });
}

function setGeoTile(n,btn){
  geoTileView=n;
  document.querySelectorAll('#tab-geo .tile-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');drawGeo();
}

function downloadGeo(){
  const exportSize=parseInt(document.getElementById('geoExportSize').value);
  const tile=buildGeoTile();
  const expCanvas=document.createElement('canvas');expCanvas.width=exportSize;expCanvas.height=exportSize;
  const ec=expCanvas.getContext('2d');
  const tw=tile.width,th=tile.height;
  const cols=Math.ceil(exportSize/tw)+1,rows=Math.ceil(exportSize/th)+1;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++)
    ec.drawImage(tile,col*tw,row*th,tw,th);
  const a=document.createElement('a');a.href=expCanvas.toDataURL('image/png');
  a.download=`${currentGeo}-pattern-${exportSize}px.png`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

initGeoGrid();
setTimeout(drawGeo,100);
</script>
