<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Upscaler — 本格AIアップスケール</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0ee;--surface:#fdf8f6;--sage:#7d9b7a;--sage-light:#c8dbc6;--sage-pale:#eaf2e9;
  --pink:#e8a8b0;--pink-light:#f7dde0;--pink-pale:#fdf0f1;--ink:#3b3634;--muted:#9a9390;
  --border:#e2d9d6;--white:#fffcfb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6;}
body::before{content:'';position:fixed;top:-120px;right:-120px;width:420px;height:420px;background:radial-gradient(circle,#f2c8cd44 0%,transparent 70%);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;bottom:-80px;left:-80px;width:340px;height:340px;background:radial-gradient(circle,#c8dbc644 0%,transparent 70%);pointer-events:none;z-index:0;}
.wrap{max-width:660px;margin:0 auto;padding:0 24px 80px;position:relative;z-index:1}
header{padding:52px 0 28px}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:16px 0 0 var(--sage-light)}
.eyebrow{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:36px;color:var(--ink);margin-bottom:8px}
.subtitle{font-size:14px;color:var(--muted);max-width:460px;line-height:1.7}
.warn-box{background:var(--pink-pale);border-left:3px solid var(--pink-light);border-radius:0 12px 12px 0;padding:14px 18px;font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:20px}
.warn-box strong{color:var(--ink);font-weight:500}
.model-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;transition:background 0.3s,border-color 0.3s}
.model-card.ready{background:var(--sage-pale);border-color:var(--sage-light)}
.spinner{width:18px;height:18px;flex-shrink:0;border:2.5px solid var(--pink-light);border-top-color:var(--pink);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.model-text{font-size:13.5px;color:var(--ink)}
.model-bar-wrap{height:5px;background:var(--pink-pale);border-radius:3px;overflow:hidden;margin-top:8px}
.model-bar{height:100%;background:linear-gradient(90deg,var(--pink),var(--sage));width:0%;transition:width 0.2s}
#drop{border:1.5px dashed var(--pink);border-radius:18px;padding:2.4rem 1.5rem;text-align:center;cursor:pointer;background:var(--pink-pale);position:relative;transition:all 0.2s}
#drop.over{background:var(--pink-light);border-color:var(--pink)}
#drop.disabled{opacity:0.5;pointer-events:none}
#drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-icon{font-size:32px;margin-bottom:10px}
.drop-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--ink);margin-bottom:4px}
.drop-sub{font-size:12.5px;color:var(--muted)}
.opt-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin:14px 0 0;flex-wrap:wrap}
.opt-row label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer}
.opt-row input[type=number]{width:90px;font-family:'Jost',sans-serif;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:20px;background:var(--white);color:var(--ink)}
.preview-wrap{display:none;margin-top:20px}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.preview-box img{max-width:100%;border-radius:8px;background:repeating-conic-gradient(#e9e2df 0% 25%,#fff 0% 50%) 0 0/12px 12px}
.preview-label{font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:0.05em;text-transform:uppercase}
.preview-meta{font-size:11px;color:var(--muted);margin-top:6px}
.status-line{font-size:13px;color:var(--muted);margin-top:16px;text-align:center;min-height:20px}
.status-line.err{color:#b1504f}
.progress-wrap{height:5px;background:var(--border);border-radius:4px;margin-top:10px;overflow:hidden;display:none}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--sage));width:0%;transition:width 0.3s}
.actions{display:flex;gap:10px;margin-top:18px}
.btn-main{flex:1;padding:13px;font-size:14.5px;font-weight:500;border-radius:24px;cursor:pointer;background:var(--sage);color:#fff;border:none;transition:opacity 0.15s}
.btn-main:hover{opacity:0.92}
.btn-main:disabled{opacity:0.4;cursor:not-allowed}
.btn-sec{padding:13px 20px;font-size:13.5px;border-radius:24px;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--ink)}
.btn-sec:hover{background:var(--surface)}
canvas{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-row"><span class="logo-dot"></span><span class="eyebrow">Digital Product Tools</span></div>
    <h1>AI Upscaler</h1>
    <p class="subtitle">本物のAIモデルで、失われたディテールを推測しながら拡大します。1枚ずつのじっくり処理専用ツールです。</p>
  </header>

  <div class="warn-box">
    <strong>このツールについて：</strong> 本格的なAIモデルを使うため処理が重く、1枚ずつの処理専用です。大きすぎる画像はブラウザがフリーズする原因になるため、内部で自動的に縮小してから処理し、仕上げにご希望のサイズへ戻します。数十秒〜数分かかることがあります。
  </div>

  <div class="model-card" id="model-status">
    <div class="spinner" id="model-spinner"></div>
    <div style="flex:1">
      <div class="model-text" id="model-text">AIモデルを読み込み中...（初回のみ）</div>
      <div class="model-bar-wrap"><div class="model-bar" id="model-bar"></div></div>
    </div>
  </div>

  <div id="drop" class="disabled">
    <input type="file" accept="image/png,image/jpeg,image/webp" id="file-input">
    <div class="drop-icon">🪄</div>
    <div class="drop-title">画像を1枚ドロップ</div>
    <div class="drop-sub">PNG / JPG / WebP · 1枚ずつ処理</div>
  </div>

  <div class="opt-row">
    <label>仕上げサイズ（長辺）</label>
    <input type="number" id="target-size" value="3000" min="500" max="8000" step="100">
    <span style="font-size:12.5px;color:var(--muted)">px</span>
  </div>

  <div class="status-line" id="status-line"></div>
  <div class="progress-wrap" id="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>

  <div class="preview-wrap" id="preview-wrap">
    <div class="preview-grid">
      <div class="preview-box">
        <div class="preview-label">Before</div>
        <img id="before-img" src="" alt="">
        <div class="preview-meta" id="before-meta"></div>
      </div>
      <div class="preview-box">
        <div class="preview-label">After（AI）</div>
        <img id="after-img" src="" alt="">
        <div class="preview-meta" id="after-meta"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-main" id="btn-download">↓ ダウンロード</button>
      <button class="btn-sec" id="btn-reset">別の画像を試す</button>
    </div>
  </div>
</div>

<canvas id="cv" style="display:none"></canvas>

<script type="module">
import Upscaler from "https://esm.sh/upscaler@1.0.0-beta.19";

let modelReady = false;
let upscalerInstance = null;
const dropEl = document.getElementById('drop');
const modelStatus = document.getElementById('model-status');
const modelText = document.getElementById('model-text');
const modelBar = document.getElementById('model-bar');
const modelSpinner = document.getElementById('model-spinner');
const statusLine = document.getElementById('status-line');
const progressWrap = document.getElementById('progress-wrap');
const progressFill = document.getElementById('progress-fill');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let resultBlob = null;
let currentFileName = 'image';

async function initModel(){
  try{
    upscalerInstance = new Upscaler();
    // ウォームアップ（小さいダミー画像で1回動かしてモデルを初期化）
    const dummy = document.createElement('canvas');
    dummy.width = 8; dummy.height = 8;
    dummy.getContext('2d').fillRect(0,0,8,8);
    await upscalerInstance.upscale(dummy.toDataURL(), { output: 'base64' });
    modelReady = true;
    modelStatus.classList.add('ready');
    modelSpinner.style.display = 'none';
    modelText.textContent = '✓ AIモデルの準備が完了しました';
    modelBar.style.width = '100%';
    dropEl.classList.remove('disabled');
  } catch(e){
    console.error(e);
    modelText.textContent = 'モデルの読み込みに失敗しました。ページを再読み込みしてください。';
  }
}
initModel();

document.getElementById('file-input').addEventListener('change', e => {
  if(e.target.files[0]) handleFile(e.target.files[0]);
});
dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('over'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('over'));
dropEl.addEventListener('drop', e => {
  e.preventDefault();
  dropEl.classList.remove('over');
  if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function handleFile(file){
  if(!modelReady){ alert('AIモデルの読み込み中です。少し待ってから試してください。'); return; }
  currentFileName = file.name.replace(/\.[^.]+$/, '');
  document.getElementById('preview-wrap').style.display = 'none';
  statusLine.className = 'status-line';
  statusLine.textContent = '準備中...';
  progressWrap.style.display = 'block';
  progressFill.style.width = '10%';

  try{
    const url = URL.createObjectURL(file);
    const img = await loadImage(url);
    document.getElementById('before-img').src = url;
    document.getElementById('before-meta').textContent = img.width + ' × ' + img.height + ' px';

    // GPUのテクスチャ上限対策：AIモデルに渡す前に長辺1000px程度まで縮小
    const SAFE_MAX = 1000;
    let sourceForAI = img;
    if(Math.max(img.width, img.height) > SAFE_MAX){
      statusLine.textContent = '大きい画像なので事前に縮小しています...';
      const scale = SAFE_MAX / Math.max(img.width, img.height);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      cv.width = w; cv.height = h;
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      sourceForAI = await loadImage(cv.toDataURL());
    }

    progressFill.style.width = '35%';
    statusLine.textContent = 'AIが拡大中です…（少しお待ちください）';

    cv.width = sourceForAI.width; cv.height = sourceForAI.height;
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(sourceForAI, 0, 0);
    const inputDataUrl = cv.toDataURL();

    const upscaledDataUrl = await upscalerInstance.upscale(inputDataUrl, {
      output: 'base64',
      patchSize: 64,
      padding: 4
    });

    progressFill.style.width = '80%';
    statusLine.textContent = '仕上げサイズに調整中...';

    const upscaledImg = await loadImage(upscaledDataUrl);
    const targetPx = parseInt(document.getElementById('target-size').value) || 3000;
    const longest = Math.max(upscaledImg.width, upscaledImg.height);
    const finalScale = targetPx / longest;
    const fw = Math.round(upscaledImg.width * finalScale), fh = Math.round(upscaledImg.height * finalScale);
    const outCv = document.createElement('canvas');
    outCv.width = fw; outCv.height = fh;
    const outCx = outCv.getContext('2d');
    outCx.imageSmoothingEnabled = true;
    outCx.imageSmoothingQuality = 'high';
    outCx.drawImage(upscaledImg, 0, 0, fw, fh);

    outCv.toBlob(blob => {
      resultBlob = blob;
      document.getElementById('after-img').src = URL.createObjectURL(blob);
      document.getElementById('after-meta').textContent = fw + ' × ' + fh + ' px';
      document.getElementById('preview-wrap').style.display = 'block';
      progressFill.style.width = '100%';
      statusLine.textContent = '✓ 完了しました';
      setTimeout(() => { progressWrap.style.display = 'none'; progressFill.style.width = '0%'; }, 600);
    }, 'image/png');

  } catch(e){
    console.error(e);
    statusLine.className = 'status-line err';
    statusLine.textContent = 'エラー: ' + (e && e.message ? e.message : String(e));
    progressWrap.style.display = 'none';
  }
}

document.getElementById('btn-download').addEventListener('click', () => {
  if(!resultBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(resultBlob);
  a.download = currentFileName + '_upscaled.png';
  a.click();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('preview-wrap').style.display = 'none';
  statusLine.textContent = '';
  document.getElementById('file-input').value = '';
});
</script>
</body>
</html>
